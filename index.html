<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Práctica VR — A-Frame</title>
  <!-- A-Frame 1.8.0 (última versión estable). Con esta sola línea ya tienes VR. -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>
<body>
  <!--
    ESCENA VR COMPLETA. Cómo probarla:
      • En computadora: clic derecho sobre el archivo en VS Code → "Open with Live Server".
        Arrastra el mouse para mirar; teclas W A S D para moverte.
      • En el celular: abre la misma URL y toca el ícono de gafas (abajo a la derecha)
        para el modo Cardboard.
    Úsala como base para: P1 (disección de una experiencia), P4 (interacción), P5 (mini-app VR).
  -->
  <a-scene>
    //inciso e
    <a-sky color="#140102"></a-sky>

    //inciso a
    <a-plane position="0 0 0" rotation="0 -90 0" width="10" height="10" color="#adacac"></a-plane>

    <!-- Geometrías primitivas (la base del modelado 3D) -->
    <!-- La caja gira cuando le haces clic con el cursor: base de la práctica de interacción P4 -->
    <a-box id="caja" scale="1 1 1" position="-1 0.1 -3" rotation="0 0 0" color="#fc1424"
           animation__giro="property: rotation; to: 0 360 0; loop: true; dur: 4000"></a-box>
           //esfera azul 
    <a-sphere position="0 2 -4" radius="0.5" color="#4287f5"></a-sphere>
    
    <!-- Texto flotante -->
    <a-text value="Hola profesor, bienvenido a la realidad virtual de mi examen" position="-2 4 -5" color="#222" width="6"></a-text>
  <a-text value="El futuro es hoy viejo" position="-2 6 -5" color="#222" width="6"></a-text>
    <!-- Cámara con cursor: apunta a la caja y haz clic para que gire -->
    <a-entity camera look-controls wasd-controls>
      <a-cursor color="#333"></a-cursor>
    </a-entity>
  </a-scene>
</body>
</html>
